name: Temporary Dev Container Validation

on:
  push:
    branches:
      - chore/46-agentic-development-toolkit

jobs:
  resolve-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dev Containers CLI
        run: npm install --global @devcontainers/cli

      - name: Resolve Feature lockfile
        run: |
          devcontainer upgrade \
            --workspace-folder . \
            --feature ghcr.io/vnzzzz/agentic-development-toolkit/agent-dev \
            --target-version 1

      - name: Verify committed lockfile is current
        run: git diff --exit-code -- .devcontainer/devcontainer-lock.json

      - name: Show generated Dev Container lockfile
        if: always()
        run: cat .devcontainer/devcontainer-lock.json

  validate-devcontainer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dev Containers CLI
        run: npm install --global @devcontainers/cli

      - name: Build and start Dev Container
        run: devcontainer up --workspace-folder .

      - name: Verify remote user
        run: devcontainer exec --workspace-folder . bash -lc 'test "$(id -un)" = "vscode"'

      - name: Verify Codex CLI
        run: devcontainer exec --workspace-folder . bash -lc 'command -v codex && codex --version'

      - name: Verify Claude Code
        run: devcontainer exec --workspace-folder . bash -lc 'command -v claude && claude --version'

      - name: Verify GitHub CLI
        run: devcontainer exec --workspace-folder . bash -lc 'command -v gh && gh --version | head -n 1'

      - name: Verify GitHub App auth helper
        run: devcontainer exec --workspace-folder . bash -lc 'command -v agent-github-auth && command -v agent-github-credential && agent-github-auth --help >/dev/null'

      - name: Verify Poetry compatibility
        run: devcontainer exec --workspace-folder . bash -lc 'command -v poetry && poetry --version'

      - name: Verify legacy volume ownership migration
        run: |
          devcontainer exec --workspace-folder . bash -lc '
            set -e
            sudo touch /app/data/.legacy-root-owned
            sudo chown -R root:root /app/data /home/vscode/.cache/pypoetry
            bash .devcontainer/ensure-volume-ownership.sh
            test "$(stat -c %u /app/data)" = "$(id -u)"
            test "$(stat -c %g /app/data)" = "$(id -g)"
            test "$(stat -c %u /app/data/.legacy-root-owned)" = "$(id -u)"
            test "$(stat -c %u /home/vscode/.cache/pypoetry)" = "$(id -u)"
            test -w /app/data
            test -w /home/vscode/.cache/pypoetry
            rm /app/data/.legacy-root-owned
          '

      - name: Verify agent-dev environment
        run: |
          devcontainer exec --workspace-folder . bash -lc '
            test "$CLAUDE_CONFIG_DIR" = "/var/lib/agentic-dev/claude"
            test "$CODEX_HOME" = "/var/lib/agentic-dev/codex"
            test "$GH_CONFIG_DIR" = "/var/lib/agentic-dev/gh"
            test -w /var/lib/agentic-dev/claude
            test -w /var/lib/agentic-dev/codex
            test -w /var/lib/agentic-dev/gh
          '
