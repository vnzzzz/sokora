name: Format preview

on:
  push:
    branches:
      - feat/58-sqlite-backup-restore

permissions:
  contents: write

jobs:
  format-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/58-sqlite-backup-restore
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.7"
      - run: uv sync --locked
      - name: Apply Ruff 0.5.7 formatting
        run: |
          uv run ruff format app/services/database_management.py app/tests/services/test_database_management_review_regressions.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/database_management.py app/tests/services/test_database_management_review_regressions.py
          if git diff --cached --quiet; then
            echo "No formatting changes"
          else
            git commit -m "style: apply Ruff formatting"
            git push origin HEAD:feat/58-sqlite-backup-restore
          fi
