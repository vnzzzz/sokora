name: Format preview

on:
  push:
    branches:
      - feat/58-sqlite-backup-restore

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.7"
      - run: uv sync --locked
      - name: Show Ruff 0.5.7 formatting diff
        run: |
          uv run ruff format app/services/database_management.py app/tests/services/test_database_management_review_regressions.py
          git diff -- app/services/database_management.py app/tests/services/test_database_management_review_regressions.py
