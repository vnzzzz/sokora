name: Format preview

on:
  pull_request:
    paths:
      - app/services/database_management.py
      - app/tests/services/test_database_management.py
      - .github/workflows/format-preview.yml

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.7"
      - run: uv sync --locked
      - name: Show Ruff format diff
        run: |
          uv run ruff format app/services/database_management.py app/tests/services/test_database_management.py
          git diff -- app/services/database_management.py app/tests/services/test_database_management.py
