name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright browsers
        run: uv run python -m playwright install --with-deps chromium

      - name: Prepare runtime dirs and assets
        run: |
          mkdir -p data assets/json
          ./scripts/prepare_dev_assets.sh

      - name: Lint (ruff)
        run: uv run ruff check app --exclude app/tests

      - name: Type check (mypy)
        run: uv run mypy app

      - name: Run tests (API/unit)
        env:
          PYTHONPATH: ${{ github.workspace }}
          SOKORA_AUTH_ENABLED: "false"
        run: uv run pytest -vv app/tests/routers/ app/tests/crud/ app/tests/services/ app/tests/utils/

      - name: Run tests (E2E)
        env:
          PYTHONPATH: ${{ github.workspace }}
          SOKORA_AUTH_ENABLED: "false"
        run: |
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level warning > /tmp/e2e_server.log 2>&1 &
          SERVER_PID=$!
          READY=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Server failed to start. Logs:"
            cat /tmp/e2e_server.log || true
            exit 1
          fi
          uv run pytest -vv app/tests/e2e/
          kill $SERVER_PID || true
