name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VERSION: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright browsers
        run: uv run python -m playwright install --with-deps chromium

      - name: Prepare runtime dirs and assets
        run: |
          mkdir -p data assets/json
          ./scripts/prepare_dev_assets.sh

      - name: Python quality checks
        run: make quality

      - name: Run tests (non-E2E)
        env:
          PYTHONPATH: ${{ github.workspace }}
          SOKORA_AUTH_ENABLED: "false"
        run: uv run pytest -vv app/tests --ignore=app/tests/e2e

      - name: Run tests (E2E)
        env:
          PYTHONPATH: ${{ github.workspace }}
          SOKORA_AUTH_ENABLED: "false"
        run: |
          # non-E2E tests include real DB integration tests. Start E2E from a
          # fresh database so app startup owns schema/seed initialization and
          # the two test phases do not share repository DB state.
          rm -f data/sokora.db data/sokora.db-shm data/sokora.db-wal
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level warning > /tmp/e2e_server.log 2>&1 &
          SERVER_PID=$!
          READY=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Server failed to start. Logs:"
            cat /tmp/e2e_server.log || true
            exit 1
          fi
          uv run pytest -vv app/tests/e2e/
          kill $SERVER_PID || true

  postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sokora
          POSTGRES_PASSWORD: sokora
          POSTGRES_DB: sokora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sokora -d sokora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VERSION: ci
      DATABASE_URL: postgresql://sokora:sokora@127.0.0.1:5432/sokora
      SOKORA_TEST_POSTGRES_URL: postgresql://sokora:sokora@127.0.0.1:5432/sokora
      SOKORA_AUTH_ENABLED: "false"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Prepare runtime directories
        run: mkdir -p data assets/json

      - name: Verify concurrent PostgreSQL startup migrations
        run: |
          uv run python -c 'from app.db.session import create_database_runtime, initialize_database; runtime = create_database_runtime("postgresql://sokora:sokora@127.0.0.1:5432/sokora"); initialize_database(runtime); runtime.dispose()' &
          MIGRATE_A=$!
          uv run python -c 'from app.db.session import create_database_runtime, initialize_database; runtime = create_database_runtime("postgresql://sokora:sokora@127.0.0.1:5432/sokora"); initialize_database(runtime); runtime.dispose()' &
          MIGRATE_B=$!
          wait "$MIGRATE_A"
          wait "$MIGRATE_B"

      - name: Verify standard migration CLI is idempotent
        run: make migrate

      - name: Verify PostgreSQL startup and major CRUD
        run: uv run pytest -vv app/tests/db/test_postgresql.py

      - name: Verify multi-replica runtime consistency
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 18083 --log-level warning > /tmp/replica_a.log 2>&1 &
          REPLICA_A_PID=$!
          uv run uvicorn app.main:app --host 127.0.0.1 --port 18084 --log-level warning > /tmp/replica_b.log 2>&1 &
          REPLICA_B_PID=$!

          cleanup() {
            kill "$REPLICA_A_PID" "$REPLICA_B_PID" 2>/dev/null || true
            wait "$REPLICA_A_PID" "$REPLICA_B_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for port in 18083 18084; do
            READY=0
            for i in {1..30}; do
              if curl -fsS "http://127.0.0.1:${port}/healthz" >/dev/null 2>&1; then
                READY=1
                break
              fi
              sleep 1
            done
            if [ "$READY" -ne 1 ]; then
              echo "Replica on port ${port} failed to start."
              cat /tmp/replica_a.log || true
              cat /tmp/replica_b.log || true
              exit 1
            fi
          done

          SOKORA_REPLICA_A_URL=http://127.0.0.1:18083 \
          SOKORA_REPLICA_B_URL=http://127.0.0.1:18084 \
            uv run pytest -vv app/tests/integration/test_multi_replica_runtime.py

      - name: Build production image with PostgreSQL driver
        env:
          VERSION: ci-postgresql
        run: make docker-build

      - name: Start production image against PostgreSQL
        run: |
          docker run -d --name sokora-postgresql --rm \
            --add-host host.docker.internal:host-gateway \
            -e PORT=8082 \
            -e SOKORA_AUTH_ENABLED=false \
            -e DATABASE_URL=postgresql://sokora:sokora@host.docker.internal:5432/sokora \
            -p 18082:8082 \
            sokora:ci-postgresql

          READY=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18082/healthz >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Production container failed to start against PostgreSQL. Logs:"
            docker logs sokora-postgresql || true
            exit 1
          fi

          curl -fsS http://127.0.0.1:18082/healthz | grep -q '"status":"ok"'
          docker exec sokora-postgresql python -c 'import psycopg; print(psycopg.__version__)'

      - name: Stop PostgreSQL production container
        if: always()
        run: docker stop sokora-postgresql || true

  production-image:
    runs-on: ubuntu-latest
    env:
      VERSION: ci
      SERVICE_PORT: "18080"
      PORT: "8080"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start production image without explicit proxy
        run: make docker-run

      - name: Smoke production runtime contract
        run: |
          READY=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Production container failed to become healthy. Logs:"
            docker logs sokora || true
            exit 1
          fi

          curl -fsS http://127.0.0.1:18080/healthz | grep -q '"status":"ok"'
          docker exec sokora sh -ceu '
            test ! -e /app/app/tests
            test ! -e /app/docs
            test ! -e /app/.devcontainer
            test ! -e /app/AGENTS.md
            ! command -v uv
            ! command -v node
            python -c "import importlib.util; raise SystemExit(1 if importlib.util.find_spec(\"pytest\") else 0)"
          '

      - name: Stop production container
        if: always()
        run: make docker-stop

  production-image-proxy:
    runs-on: ubuntu-latest
    env:
      VERSION: ci-proxy
      SERVICE_PORT: "18081"
      PORT: "8081"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start local forward proxy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tinyproxy
          cat <<'EOF' | sudo tee -a /etc/tinyproxy/tinyproxy.conf >/dev/null
          Allow 10.0.0.0/8
          Allow 172.16.0.0/12
          Allow 192.168.0.0/16
          EOF
          sudo service tinyproxy restart
          GATEWAY="$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')"
          echo "PROXY_URL=http://${GATEWAY}:8888" >> "$GITHUB_ENV"
          sudo truncate -s 0 /var/log/tinyproxy/tinyproxy.log

      - name: Build and start production image through proxy
        run: proxy="$PROXY_URL" NO_PROXY="localhost,127.0.0.1" make docker-run

      - name: Verify build and runtime proxy behavior
        run: |
          READY=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18081/healthz >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Proxy-configured production container failed to start. Logs:"
            docker logs sokora || true
            exit 1
          fi

          # Build-time npm/uv/holiday-cache traffic must have reached the proxy.
          sudo grep -Eq 'registry\.npmjs\.org|pypi\.org|pythonhosted\.org|holidays-jp\.github\.io' /var/log/tinyproxy/tinyproxy.log

          # Runtime proxy variables are injected, including bypass configuration.
          docker exec sokora env | grep -Fx "HTTP_PROXY=$PROXY_URL"
          docker exec sokora env | grep -Fx "HTTPS_PROXY=$PROXY_URL"
          docker exec sokora env | grep -Fx 'NO_PROXY=localhost,127.0.0.1'

          # HTTPX is used by the OIDC client and honors the runtime proxy environment.
          docker exec sokora python -c 'import httpx; response = httpx.get("https://example.com", timeout=10); response.raise_for_status()'
          sudo grep -q 'example.com' /var/log/tinyproxy/tinyproxy.log

          # The in-container health probe remains direct and independent of proxy env.
          docker exec sokora python -c 'import http.client, os; connection = http.client.HTTPConnection("127.0.0.1", int(os.environ["PORT"]), timeout=3); connection.request("GET", "/healthz"); response = connection.getresponse(); raise SystemExit(0 if response.status == 200 else 1)'

      - name: Show proxy logs on failure
        if: failure()
        run: sudo cat /var/log/tinyproxy/tinyproxy.log || true

      - name: Stop production container
        if: always()
        run: make docker-stop
