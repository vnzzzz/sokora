name: PR82 Ruff Format

on:
  push:
    branches: ["refactor/54-alembic-lifecycle"]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/54-alembic-lifecycle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.7"
      - run: uv sync --locked
      - name: Format and commit
        run: |
          uv run ruff format scripts/migration/alembic/env.py
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/migration/alembic/env.py
          git commit -m "style: P1 migration修正をRuff formatに合わせる"
          git push origin HEAD:refactor/54-alembic-lifecycle
