name: Schema diagnostic

on:
  push:
    branches:
      - feat/58-sqlite-backup-restore

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.7"
      - run: uv sync --locked
      - name: Print fresh/adopted schema signature differences
        run: |
          uv run python - <<'PY'
          import sqlite3
          import tempfile
          from pathlib import Path
          import app.models  # noqa: F401
          from app.db.session import Base, create_database_runtime, initialize_database, migrate_database
          from app.services.database_management import _schema_signature

          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              fresh_path = root / 'fresh.db'
              legacy_path = root / 'legacy.db'
              fresh_runtime = create_database_runtime(f'sqlite:///{fresh_path}')
              legacy_runtime = create_database_runtime(f'sqlite:///{legacy_path}')
              try:
                  initialize_database(fresh_runtime)
                  Base.metadata.create_all(bind=legacy_runtime.engine)
                  migrate_database(legacy_runtime)
                  with sqlite3.connect(fresh_path) as fresh, sqlite3.connect(legacy_path) as legacy:
                      fs = _schema_signature(fresh)
                      ls = _schema_signature(legacy)
                      print('TABLE_SIGNATURE_EQUAL=', fs.tables == ls.tables)
                      fresh_tables = dict(fs.tables)
                      legacy_tables = dict(ls.tables)
                      for name in sorted(set(fresh_tables) | set(legacy_tables)):
                          if fresh_tables.get(name) != legacy_tables.get(name):
                              print('TABLE_DIFF', name)
                              print(' fresh=', repr(fresh_tables.get(name)))
                              print(' legacy=', repr(legacy_tables.get(name)))
                      print('SQL_SIGNATURE_EQUAL=', fs.sql_definitions == ls.sql_definitions)
                      fd = {(row[0], row[1], row[2]): row[3] for row in fs.sql_definitions}
                      ld = {(row[0], row[1], row[2]): row[3] for row in ls.sql_definitions}
                      for key in sorted(set(fd) | set(ld)):
                          if fd.get(key) != ld.get(key):
                              print('SQL_DIFF', key)
                              print(' fresh=', repr(fd.get(key)))
                              print(' legacy=', repr(ld.get(key)))
                              raw_f = fresh.execute('SELECT sql FROM sqlite_master WHERE type=? AND name=?', (key[0], key[1])).fetchone()
                              raw_l = legacy.execute('SELECT sql FROM sqlite_master WHERE type=? AND name=?', (key[0], key[1])).fetchone()
                              print(' raw_fresh=', repr(raw_f[0] if raw_f else None))
                              print(' raw_legacy=', repr(raw_l[0] if raw_l else None))
              finally:
                  fresh_runtime.dispose()
                  legacy_runtime.dispose()
          PY
