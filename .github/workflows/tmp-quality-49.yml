name: Temporary quality migration check

on:
  push:
    branches:
      - chore/49-python-quality-tools

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.7"
      - run: uv sync --locked
      - name: Current lint baseline
        run: uv run ruff check app --exclude app/tests
      - name: Import sorting baseline
        continue-on-error: true
        run: uv run ruff check app --select I --output-format concise
      - name: Ruff format baseline
        continue-on-error: true
        run: uv run ruff format --check app
