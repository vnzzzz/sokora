name: Temporary quality migration check

on:
  push:
    branches:
      - chore/49-python-quality-tools

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/49-python-quality-tools
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.7"
      - name: Resolve dependencies
        run: |
          uv lock
          uv sync --locked
      - name: Apply Ruff baseline
        run: |
          uv run ruff check app scripts --fix || true
          uv run ruff format app scripts
      - name: Commit generated baseline
        run: |
          if git diff --quiet -- uv.lock app scripts; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock app scripts
          git commit -m "style: apply Ruff quality baseline"
          git push origin HEAD:chore/49-python-quality-tools
      - name: Validate Ruff baseline
        run: |
          uv run ruff check app scripts
          uv run ruff format --check app scripts
