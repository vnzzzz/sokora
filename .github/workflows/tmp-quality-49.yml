name: Temporary quality migration check

on:
  push:
    branches:
      - chore/49-python-quality-tools

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.7"
      - run: uv lock
      - run: uv sync --locked
      - name: Python source lint baseline
        continue-on-error: true
        run: uv run ruff check app scripts --output-format concise
      - name: Python source format baseline
        continue-on-error: true
        run: uv run ruff format --check app scripts
