name: Schema signature diagnostic
on:
  push:
    branches: [feat/58-sqlite-backup-restore]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
      SOKORA_AUTH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.7"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --locked
      - name: Prepare runtime dirs and assets
        run: |
          mkdir -p data assets/json
          ./scripts/prepare_dev_assets.sh
      - name: Target test alone
        continue-on-error: true
        run: uv run pytest -vv app/tests/services/test_database_management_review_regressions.py::test_restore_accepts_equivalent_adopted_create_all_schema
      - name: Regression file in normal order
        continue-on-error: true
        run: uv run pytest -vv app/tests/services/test_database_management_review_regressions.py
      - name: Direct comparison after pytest imports
        run: |
          uv run python - <<'PY'
          import sqlite3
          import tempfile
          from pathlib import Path
          import app.tests.conftest  # noqa: F401
          import app.models  # noqa: F401
          from app.db.session import Base, create_database_runtime, initialize_database, migrate_database
          from app.services.database_management import _schema_signature

          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              fresh_path = root / "fresh.db"
              legacy_path = root / "legacy.db"
              fresh_runtime = create_database_runtime(f"sqlite:///{fresh_path}")
              legacy_runtime = create_database_runtime(f"sqlite:///{legacy_path}")
              try:
                  initialize_database(fresh_runtime)
                  Base.metadata.create_all(bind=legacy_runtime.engine)
                  migrate_database(legacy_runtime)
                  with sqlite3.connect(fresh_path) as fresh, sqlite3.connect(legacy_path) as legacy:
                      fresh_signature = _schema_signature(fresh)
                      legacy_signature = _schema_signature(legacy)
                      print("SIGNATURE_EQUAL=", fresh_signature == legacy_signature)
                      fresh_tables = dict(fresh_signature.tables)
                      legacy_tables = dict(legacy_signature.tables)
                      for name in sorted(set(fresh_tables) | set(legacy_tables)):
                          if fresh_tables.get(name) != legacy_tables.get(name):
                              print("TABLE_DIFF", name)
                              print("fresh=", repr(fresh_tables.get(name)))
                              print("legacy=", repr(legacy_tables.get(name)))
                              print("raw_fresh=", repr(fresh.execute("SELECT sql FROM sqlite_master WHERE type='table' AND name=?", (name,)).fetchone()[0]))
                              print("raw_legacy=", repr(legacy.execute("SELECT sql FROM sqlite_master WHERE type='table' AND name=?", (name,)).fetchone()[0]))
              finally:
                  fresh_runtime.dispose()
                  legacy_runtime.dispose()
          PY
