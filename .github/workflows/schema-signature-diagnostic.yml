name: Schema signature diagnostic
on:
  push:
    branches: [feat/58-sqlite-backup-restore]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
      SOKORA_AUTH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.7"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --locked
      - name: Prepare runtime dirs and assets
        run: |
          mkdir -p data assets/json
          ./scripts/prepare_dev_assets.sh
      - name: Prior database management tests plus target
        continue-on-error: true
        run: |
          uv run pytest -q \
            app/tests/services/test_database_management.py \
            app/tests/services/test_database_management_review_regressions.py::test_restore_accepts_equivalent_adopted_create_all_schema
      - name: Core CRUD DB plus target
        continue-on-error: true
        run: |
          uv run pytest -q \
            app/tests/core app/tests/crud app/tests/db \
            app/tests/services/test_database_management_review_regressions.py::test_restore_accepts_equivalent_adopted_create_all_schema
      - name: Integration routers schemas plus target
        continue-on-error: true
        run: |
          uv run pytest -q \
            app/tests/integration app/tests/routers app/tests/schemas \
            app/tests/services/test_database_management_review_regressions.py::test_restore_accepts_equivalent_adopted_create_all_schema
      - name: Earlier service tests plus target
        continue-on-error: true
        run: |
          uv run pytest -q \
            app/tests/services/auth \
            app/tests/services/test_analysis_read_service.py \
            app/tests/services/test_calendar_read_service.py \
            app/tests/services/test_custom_holiday_service.py \
            app/tests/services/test_database_management.py \
            app/tests/services/test_database_management_review_regressions.py::test_restore_accepts_equivalent_adopted_create_all_schema
