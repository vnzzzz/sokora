name: Apply PR 175 review fixes

on:
  push:
    branches:
      - issue-174-ui-visual-cleanup

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-174-ui-visual-cleanup
          fetch-depth: 0
      - name: Apply review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path("app/tests/routers/pages/test_auth.py")
          test_text = test_path.read_text()
          old_test = 'assert any("pt-14" in cls for cls in main_classes)'
          new_test = 'assert any("pt-12" in cls for cls in main_classes)'
          if old_test not in test_text:
              raise SystemExit("expected shell spacing assertion not found")
          test_path.write_text(test_text.replace(old_test, new_test, 1))

          css_path = Path("builder/input.css")
          css_text = css_path.read_text()
          old_tone = "--location-tone-26: 244 63 94;"
          new_tone = "--location-tone-26: 248 80 110;"
          if old_tone not in css_text:
              raise SystemExit("expected dark tone 26 value not found")
          css_path.write_text(css_text.replace(old_tone, new_tone, 1))
          PY
          rm .github/workflows/pr175-review-fix.yml
          git diff --check
      - name: Commit review fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/tests/routers/pages/test_auth.py builder/input.css .github/workflows/pr175-review-fix.yml
          git commit -m "fix: address UI review findings"
          git push origin HEAD:issue-174-ui-visual-cleanup
