name: Temporary uv Migration

on:
  push:
    branches:
      - chore/48-migrate-to-uv

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"

      - name: Migrate Poetry metadata and lockfile
        run: uvx --from migrate-to-uv==0.12.0 migrate-to-uv

      - name: Show migration diff
        run: git diff -- pyproject.toml poetry.lock uv.lock

      - name: Upload migrated files
        uses: actions/upload-artifact@v4
        with:
          name: uv-migration-48
          path: |
            pyproject.toml
            uv.lock
