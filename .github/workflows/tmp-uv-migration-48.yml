name: Temporary uv Migration

on:
  push:
    branches:
      - chore/48-migrate-to-uv

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"

      - name: Migrate Poetry metadata and lockfile
        run: |
          if [ ! -f poetry.lock ]; then
            echo "Already migrated; nothing to do."
            exit 0
          fi

          uvx --from migrate-to-uv==0.12.0 migrate-to-uv

          python - <<'PY'
          from pathlib import Path

          path = Path("pyproject.toml")
          text = path.read_text()
          old = '''[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-name = ["app"]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
'''
          new = '''[tool.uv]
package = false
'''
          if old not in text:
              raise SystemExit("Unexpected migrate-to-uv pyproject output")
          path.write_text(text.replace(old, new))
          PY

          uv lock
          uv lock --check
          uv sync --locked
          UV_PROJECT_ENVIRONMENT=.venv-prod uv sync --locked --no-dev

      - name: Commit migrated dependency files
        run: |
          if [ -f poetry.lock ]; then
            echo "Migration did not remove poetry.lock"
            exit 1
          fi

          if git diff --quiet -- pyproject.toml uv.lock poetry.lock; then
            echo "No migration changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock poetry.lock
          git commit -m "chore: migrate dependency metadata to uv"
          git push
