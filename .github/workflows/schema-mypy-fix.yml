name: Schema mypy fix
on:
  push:
    branches: [feat/58-sqlite-backup-restore]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
      SOKORA_AUTH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/58-sqlite-backup-restore
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.7"
      - run: uv sync --locked
      - name: Fix sqlite pragma typing and validate
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/services/database_management.py")
          text = path.read_text()
          assert text.count("int(row[0])") == 1
          assert text.count("int(row[1])") == 1
          text = text.replace("int(row[0])", "int(str(row[0]))", 1)
          text = text.replace("int(row[1])", "int(str(row[1]))", 1)
          path.write_text(text)
          PY
          uv run ruff format app/services/database_management.py
          uv run ruff check app/services/database_management.py
          uv run mypy app
          mkdir -p data assets/json
          uv run pytest -q app/tests/services/test_database_management.py app/tests/services/test_database_management_review_regressions.py
      - name: Remove temporary workflow and commit fix
        run: |
          rm .github/workflows/schema-mypy-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/database_management.py .github/workflows/schema-mypy-fix.yml
          git commit -m "fix: type SQLite foreign key identifiers"
          git push origin HEAD:feat/58-sqlite-backup-restore
