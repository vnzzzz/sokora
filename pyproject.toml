[project]
name = "sokora"
version = "0.1.0"
description = "勤怠管理のためのシンプルなWebアプリケーション"
authors = [{ name = "Sokora Team", email = "info@example.com" }]
requires-python = ">=3.13,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi>=0.103.1,<0.104",
    "uvicorn[standard]>=0.23.2,<0.24",
    "jinja2>=3.1.2,<4",
    "python-multipart>=0.0.6,<0.0.7",
    "pydantic>=2.4.0,<3",
    "sqlalchemy>=2.0.23,<3",
    "httpx>=0.27.0,<0.28",
    "pytz>=2023.3,<2024",
    "python-dateutil>=2.9.0.post0,<3",
    "aiosqlite>=0.20.0,<0.21",
    "types-python-dateutil>=2.9.0.20241206,<3",
    "itsdangerous>=2.2.0,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.10.0,<2",
    "pytest>=8.2.2,<9",
    "pytest-cov>=4.1.0,<5",
    "pytest-asyncio>=0.23.7,<0.24",
    "ruff>=0.5.0,<0.6",
    "pytest-playwright>=0.7.0,<0.8",
    "alembic>=1.15.2,<2",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "app.tests.*"
ignore_errors = true

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["scripts/migration/alembic/versions"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
# 必要に応じて他の pytest オプションを追加
# asyncio_mode = "strict"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]
