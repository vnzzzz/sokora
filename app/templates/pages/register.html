{% extends "layout/base.html" %}
{% set title_text = "勤怠登録（個別）" %}

{% block content %}
<div class="p-4">
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-lg font-bold text-base-content">勤怠登録（個別）</h2>
  </div>

  <div class="mt-4">
    {% if users|length == 0 %}
      <div class="alert alert-info shadow-sm"></div>
    {% else %}
      <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
        <div class="md:col-span-4 lg:col-span-3">
          {% include "components/partials/register/user_list.html" %}
        </div>

        <div class="md:col-span-8 lg:col-span-9" id="calendar-container">
          <div id="user-calendar">
            <div class="flex h-full items-center justify-center bg-base-200 rounded-lg p-8 text-center">
              <div></div>
            </div>
          </div>
        </div>
      </div>
    {% endif %}
  </div>
</div>
{% endblock %}
