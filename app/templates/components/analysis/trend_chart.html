{% set max_count = trend_points|map(attribute='count')|max %}
{% set point_count = trend_points|length %}
<figure class="mt-7" data-testid="analysis-trend-chart" aria-labelledby="analysis-trend-heading">
  <div class="flex flex-wrap items-baseline justify-between gap-2">
    <div>
      <figcaption id="analysis-trend-heading" class="text-sm font-medium text-base-content">
        登録日数の推移
      </figcaption>
      <p class="mt-1 text-xs text-base-content/50">
        {% if is_year_mode %}月ごとの延べ登録日数{% else %}日ごとの延べ登録日数{% endif %}
      </p>
    </div>
    <span class="text-xs text-base-content/50">
      {% if is_year_mode %}月別{% else %}日別{% endif %}
    </span>
  </div>

  <div class="mt-4 overflow-x-auto pb-2" data-testid="analysis-trend-scroller">
    <svg
      class="block h-64 min-w-[46rem] w-full"
      viewBox="0 0 800 240"
      role="img"
      aria-labelledby="analysis-trend-svg-title analysis-trend-svg-desc"
      data-testid="analysis-trend-plot"
    >
      <title id="analysis-trend-svg-title">{{ analysis_data.period.label }}の登録日数推移</title>
      <desc id="analysis-trend-svg-desc">
        {% if is_year_mode %}4月から翌3月までの月別{% else %}対象月の日別{% endif %}の延べ登録日数を線グラフで表示します。
      </desc>

      <g class="text-base-content/15" stroke="currentColor" stroke-width="1">
        <line x1="58" y1="40" x2="758" y2="40"></line>
        <line x1="58" y1="90" x2="758" y2="90"></line>
        <line x1="58" y1="140" x2="758" y2="140"></line>
        <line x1="58" y1="190" x2="758" y2="190"></line>
      </g>

      <g class="text-base-content/50" fill="currentColor" font-size="11">
        <text x="48" y="44" text-anchor="end">{{ max_count }}</text>
        <text x="48" y="194" text-anchor="end">0</text>
      </g>

      {% if max_count > 0 %}
      <g class="text-primary">
        {% for point in trend_points %}
          {% set x = 58 + (loop.index0 * 700 / (point_count - 1)) %}
          {% set y = 190 - (point.count * 150 / max_count) %}
          {% if not loop.last %}
            {% set next_point = trend_points[loop.index] %}
            {% set next_x = 58 + (loop.index * 700 / (point_count - 1)) %}
            {% set next_y = 190 - (next_point.count * 150 / max_count) %}
            <polygon
              points="{{ x }},190 {{ x }},{{ y }} {{ next_x }},{{ next_y }} {{ next_x }},190"
              fill="currentColor"
              opacity="0.08"
            ></polygon>
            <line
              x1="{{ x }}"
              y1="{{ y }}"
              x2="{{ next_x }}"
              y2="{{ next_y }}"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
            ></line>
          {% endif %}
          <circle cx="{{ x }}" cy="{{ y }}" r="3.5" fill="currentColor">
            <title>{{ point.label }}: {{ point.count }}日</title>
          </circle>
        {% endfor %}
      </g>
      {% else %}
      <text
        x="408"
        y="118"
        text-anchor="middle"
        class="text-base-content/50"
        fill="currentColor"
        font-size="13"
      >
        {% if selected_location_ids|length == 0 %}集計対象を選択してください{% else %}この期間の登録データはありません{% endif %}
      </text>
      {% endif %}

      <g class="text-base-content/50" fill="currentColor" font-size="11">
        {% for point in trend_points %}
          {% if is_year_mode or loop.first or loop.last or loop.index % 5 == 0 %}
            {% set x = 58 + (loop.index0 * 700 / (point_count - 1)) %}
            <text x="{{ x }}" y="216" text-anchor="middle">{{ point.label }}</text>
          {% endif %}
        {% endfor %}
      </g>
    </svg>
  </div>
</figure>
