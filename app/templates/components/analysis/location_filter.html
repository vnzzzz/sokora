<form
  id="analysis-location-filter"
  hx-get="/analysis"
  hx-trigger="change"
  hx-target="#analysis-table-region"
  hx-swap="outerHTML"
  hx-push-url="false"
>
  {% if is_year_mode %}
  <input type="hidden" name="mode" value="year" />
  <input type="hidden" name="year" value="{{ current_year }}" />
  {% else %}
  <input type="hidden" name="month" value="{{ current_month }}" />
  {% endif %}

  <details>
    <summary class="cursor-pointer list-none">
      <span class="flex flex-wrap items-center justify-between gap-2">
        <span>
          <span id="analysis-target-heading" class="block text-sm font-medium text-base-content">集計対象</span>
          <span class="mt-1 block text-xs text-base-content/60">
            勤務種別を絞り込む場合に開いてください。初期状態はすべてを表示します。
          </span>
        </span>
        <span class="text-xs text-base-content/50">絞り込み</span>
      </span>
    </summary>

    <fieldset class="mt-4" aria-labelledby="analysis-target-heading">
      <legend class="sr-only">集計対象の勤務種別</legend>
      <div class="grid gap-x-8 gap-y-5 sm:grid-cols-2 xl:grid-cols-3">
        {% for category in location_categories %}
        <div>
          <h4 class="mb-2 border-b border-base-300 pb-1 text-xs font-medium text-base-content/70">
            {{ category.name }}
          </h4>
          <div class="flex flex-wrap gap-x-4 gap-y-2">
            {% for location in category.locations %}
            <label class="flex items-center gap-2 cursor-pointer" for="location-{{ location.id }}">
              <input
                type="checkbox"
                id="location-{{ location.id }}"
                name="selected_locations"
                value="{{ location.id }}"
                class="checkbox checkbox-sm location-checkbox"
                {% if location.id in selected_location_ids %}checked{% endif %}
              />
              <span class="text-sm">{{ location.name }}</span>
            </label>
            {% endfor %}
          </div>
        </div>
        {% endfor %}
      </div>
    </fieldset>
  </details>
</form>
