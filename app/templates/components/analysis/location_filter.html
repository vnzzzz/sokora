<form
  id="analysis-location-filter"
  hx-get="/analysis"
  hx-trigger="change"
  hx-target="#analysis-table-region"
  hx-swap="outerHTML"
  hx-push-url="false"
>
  {% if is_year_mode %}
  <input type="hidden" name="mode" value="year" />
  <input type="hidden" name="year" value="{{ current_year }}" />
  {% else %}
  <input type="hidden" name="month" value="{{ current_month }}" />
  {% endif %}

  <details>
    <summary class="cursor-pointer list-none">
      <span class="flex items-center justify-between gap-3">
        <span id="analysis-target-heading" class="text-sm font-medium text-base-content">表示系列</span>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="h-4 w-4 text-base-content/45"
          aria-hidden="true"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
        </svg>
      </span>
    </summary>

    <fieldset class="mt-4" aria-labelledby="analysis-target-heading">
      <legend class="sr-only">グラフに表示する系列</legend>

      <div class="flex flex-wrap items-center justify-between gap-3 border-b border-base-300 pb-4">
        <label class="flex cursor-pointer items-center gap-2" for="analysis-total-series">
          <input
            type="checkbox"
            id="analysis-total-series"
            name="show_total"
            value="true"
            class="checkbox checkbox-sm"
            data-analysis-series-checkbox
            {% if include_total %}checked{% endif %}
          />
          <span class="text-sm font-medium">全合計</span>
        </label>

        <div class="flex flex-wrap gap-1" aria-label="勤務場所の一括操作">
          <button type="button" class="btn btn-ghost btn-xs" data-analysis-select-all>全選択</button>
          <button type="button" class="btn btn-ghost btn-xs" data-analysis-clear-all>全解除</button>
        </div>
      </div>

      <div class="mt-4 grid gap-x-8 gap-y-5 sm:grid-cols-2 xl:grid-cols-3">
        {% for category in location_categories %}
        <div>
          <h4 class="mb-2 border-b border-base-300 pb-1 text-xs font-medium text-base-content/70">
            {{ category.name }}
          </h4>
          <div class="flex flex-wrap gap-x-4 gap-y-2">
            {% for location in category.locations %}
            <label class="flex cursor-pointer items-center gap-2" for="location-{{ location.id }}">
              <input
                type="checkbox"
                id="location-{{ location.id }}"
                name="selected_locations"
                value="{{ location.id }}"
                class="checkbox checkbox-sm location-checkbox"
                data-analysis-series-checkbox
                {% if location.id in selected_location_ids %}checked{% endif %}
              />
              <span class="text-sm">{{ location.name }}</span>
            </label>
            {% endfor %}
          </div>
        </div>
        {% endfor %}
      </div>
    </fieldset>
  </details>
</form>
