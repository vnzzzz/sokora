<div class="max-w-5xl">
  <h3 id="analysis-period-heading" class="text-sm font-semibold text-base-content">集計期間</h3>
  <p class="mt-1 text-xs text-base-content/60">
    月次は日ごとの推移、年度は4月から翌3月までの月ごとの推移を確認します。
  </p>

  <div class="mt-4 grid gap-6 md:grid-cols-2">
    <div
      class="border-l-2 py-1 pl-4 {% if not is_year_mode %}border-primary{% else %}border-base-300{% endif %}"
      data-testid="analysis-month-period"
    >
      <div class="flex flex-wrap items-baseline justify-between gap-2">
        <h4 class="text-sm font-medium text-base-content">月次集計</h4>
        {% if not is_year_mode %}
        <span class="text-xs text-primary">表示中</span>
        {% endif %}
      </div>
      <p class="mt-1 text-xs text-base-content/60">選択月の日別推移と社員別明細を表示します。</p>
      <div class="mt-3">
        <label class="sr-only" for="month-input">対象月</label>
        <input
          type="month"
          id="month-input"
          name="month"
          class="input input-bordered input-sm w-full max-w-full sm:w-48"
          value="{{ current_month or '' }}"
          hx-get="/analysis"
          hx-trigger="change"
          hx-target="#analysis-view"
          hx-swap="outerHTML"
          hx-push-url="true"
        />
      </div>
    </div>

    <div
      class="border-l-2 py-1 pl-4 {% if is_year_mode %}border-primary{% else %}border-base-300{% endif %}"
      data-testid="analysis-year-period"
    >
      <div class="flex flex-wrap items-baseline justify-between gap-2">
        <h4 class="text-sm font-medium text-base-content">年度集計</h4>
        {% if is_year_mode %}
        <span class="text-xs text-primary">表示中</span>
        {% endif %}
      </div>
      <p class="mt-1 text-xs text-base-content/60">4月〜翌3月を月単位で俯瞰し、社員別明細を表示します。</p>
      <div class="mt-3 flex flex-wrap items-center gap-2">
        <label class="sr-only" for="year-select">対象年度</label>
        <select
          id="year-select"
          name="year"
          class="select select-bordered select-sm w-32 max-w-full"
          hx-get="/analysis?mode=year"
          hx-trigger="change"
          hx-target="#analysis-view"
          hx-swap="outerHTML"
          hx-push-url="true"
        >
          {% for year_option in year_options %}
          <option value="{{ year_option }}" {% if year_option == current_year %}selected{% endif %}>
            {{ year_option }}年度
          </option>
          {% endfor %}
        </select>
        <span class="text-xs text-base-content/60">4月〜翌3月</span>
      </div>
    </div>
  </div>
</div>
