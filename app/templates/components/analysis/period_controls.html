<div class="max-w-4xl">
  <h3 id="analysis-period-heading" class="text-sm font-semibold text-base-content">対象期間</h3>

  <fieldset class="mt-3">
    <legend class="sr-only">集計期間の単位</legend>
    <div class="flex flex-wrap items-center gap-x-5 gap-y-3">
      <label class="flex items-center gap-2 cursor-pointer" for="period-month">
        <input
          type="radio"
          id="period-month"
          name="period-type"
          value="month"
          class="radio radio-sm"
          {% if not is_year_mode %}checked{% endif %}
          hx-get="/analysis?month={{ current_month }}"
          hx-trigger="change"
          hx-target="#analysis-view"
          hx-swap="outerHTML"
          hx-push-url="true"
          hx-params="none"
        />
        <span class="text-sm">月別</span>
      </label>

      <label class="flex items-center gap-2 cursor-pointer" for="period-year">
        <input
          type="radio"
          id="period-year"
          name="period-type"
          value="year"
          class="radio radio-sm"
          {% if is_year_mode %}checked{% endif %}
          hx-get="/analysis?mode=year&amp;year={{ current_year }}"
          hx-trigger="change"
          hx-target="#analysis-view"
          hx-swap="outerHTML"
          hx-push-url="true"
          hx-params="none"
        />
        <span class="text-sm">年度別</span>
      </label>

      <div id="month-selection" class="{% if is_year_mode %}hidden{% endif %}">
        <label class="sr-only" for="month-input">対象月</label>
        <input
          type="month"
          id="month-input"
          name="month"
          class="input input-bordered input-sm w-48"
          value="{{ current_month or '' }}"
          hx-get="/analysis"
          hx-trigger="change"
          hx-target="#analysis-view"
          hx-swap="outerHTML"
          hx-push-url="true"
        />
      </div>

      <div id="year-selection" class="{% if not is_year_mode %}hidden{% endif %}">
        <div class="flex items-center gap-2">
          <label class="sr-only" for="year-select">対象年度</label>
          <select
            id="year-select"
            name="year"
            class="select select-bordered select-sm w-32"
            hx-get="/analysis?mode=year"
            hx-trigger="change"
            hx-target="#analysis-view"
            hx-swap="outerHTML"
            hx-push-url="true"
          >
            {% for year_option in year_options %}
            <option value="{{ year_option }}" {% if year_option == current_year %}selected{% endif %}>
              {{ year_option }}年度
            </option>
            {% endfor %}
          </select>
          <span class="text-xs text-base-content/60">4月〜翌3月</span>
        </div>
      </div>
    </div>
  </fieldset>
</div>
