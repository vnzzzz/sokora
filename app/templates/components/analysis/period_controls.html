<div>
  <div class="mb-1 flex items-center justify-between gap-3">
    <label
      class="block text-xs font-medium text-base-content/70"
      for="{% if is_year_mode %}year-select{% else %}month-input{% endif %}"
    >
      {% if is_year_mode %}対象年度{% else %}対象月{% endif %}
    </label>

    <nav class="inline-flex items-center gap-1 text-xs" aria-label="集計単位">
      <a
        href="/analysis?month={{ current_month }}"
        class="rounded px-2 py-1 font-medium {% if not is_year_mode %}bg-base-300 text-base-content{% else %}text-base-content/50 hover:bg-base-200 hover:text-base-content{% endif %}"
        data-analysis-mode-tab="month"
        {% if not is_year_mode %}aria-current="page"{% endif %}
        hx-get="/analysis?month={{ current_month }}"
        hx-target="#analysis-view"
        hx-swap="outerHTML"
        hx-push-url="true"
      >月次</a>
      <a
        href="/analysis?mode=year&amp;year={{ current_year }}"
        class="rounded px-2 py-1 font-medium {% if is_year_mode %}bg-base-300 text-base-content{% else %}text-base-content/50 hover:bg-base-200 hover:text-base-content{% endif %}"
        data-analysis-mode-tab="year"
        {% if is_year_mode %}aria-current="page"{% endif %}
        hx-get="/analysis?mode=year&amp;year={{ current_year }}"
        hx-target="#analysis-view"
        hx-swap="outerHTML"
        hx-push-url="true"
      >年度</a>
    </nav>
  </div>

  {% if is_year_mode %}
  <select
    id="year-select"
    name="year"
    class="select select-bordered select-sm w-full"
    hx-get="/analysis?mode=year"
    hx-trigger="change"
    hx-target="#analysis-view"
    hx-swap="outerHTML"
    hx-push-url="true"
  >
    {% for year_option in year_options %}
    <option value="{{ year_option }}" {% if year_option == current_year %}selected{% endif %}>
      {{ year_option }}年度
    </option>
    {% endfor %}
  </select>
  {% else %}
  <input
    type="month"
    id="month-input"
    name="month"
    class="input input-bordered input-sm w-full"
    value="{{ current_month or '' }}"
    hx-get="/analysis"
    hx-trigger="change"
    hx-target="#analysis-view"
    hx-swap="outerHTML"
    hx-push-url="true"
  />
  {% endif %}
</div>
