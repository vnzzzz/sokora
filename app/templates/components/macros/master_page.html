{% macro page_header(title, add_label, add_url, width_class='max-w-[700px]') -%}
<div class="flex justify-between items-center {{ width_class }} mb-4">
  <h2 class="text-lg font-bold text-base-content">{{ title }}</h2>
  <button
    class="btn btn-sm btn-outline shadow-sm hover:shadow"
    hx-get="{{ add_url }}"
    hx-target="body"
    hx-swap="beforeend"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="1.5"
      stroke="currentColor"
      class="w-4 h-4 mr-1"
      aria-hidden="true"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m6-6H6" />
    </svg>
    {{ add_label }}
  </button>
</div>
{%- endmacro %}

{% macro empty_state(message, width_class='') -%}
<div class="alert alert-info shadow-sm {{ width_class }}">
  <svg
    xmlns="http://www.w3.org/2000/svg"
    fill="none"
    viewBox="0 0 24 24"
    class="stroke-current shrink-0 w-6 h-6"
    aria-hidden="true"
  >
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="2"
      d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
    ></path>
  </svg>
  <span>{{ message }}</span>
</div>
{%- endmacro %}
