<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sokora - シンプルな勤怠管理システム" />
  <meta name="format-detection" content="telephone=no, email=no, address=no" />
  <meta name="htmx-config" content='{"historyCacheSize":0}' />

  <!-- theme flashを避けるため初回描画前の属性設定だけinlineで行う -->
  <script>
    ;(function () {
      const savedTheme = localStorage.getItem('theme') || 'light'
      document.documentElement.setAttribute('data-theme', savedTheme)
      document.addEventListener('DOMContentLoaded', () => {
        document.body.setAttribute('data-theme', savedTheme)
      })
    })()
  </script>

  <title>Sokora - {% if title_text %}{{ title_text }}{% else %}勤怠管理システム{% endif %}</title>
  <link rel="icon" href="/static/favicon.ico" sizes="any" />

  <script defer src="/assets/js/alpine.min.js"></script>
  <script defer src="/assets/js/htmx.min.js"></script>

  <link href="/assets/css/main.css" rel="stylesheet" />
  <link href="{{ url_for('static', path='css/calendar.css') }}" rel="stylesheet" />

  <style>
    html,
    body {
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    [data-theme='dark'] ::selection {
      background-color: rgba(255, 255, 255, 0.2);
    }

    [data-theme='light'] ::selection {
      background-color: rgba(0, 0, 0, 0.1);
    }
  </style>

  <meta name="theme-color" content="#4a5568" />
</head>
