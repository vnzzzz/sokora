  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sokora - シンプルな勤怠管理システム" />
  <meta name="format-detection" content="telephone=no, email=no, address=no" />
  <meta name="htmx-config" content='{"historyCacheSize":0}' />

  <!-- theme/sidebarの保存stateをCSS読込前に反映し、初回paintを安定させる。 -->
  <script>
    ;(function () {
      let savedTheme = 'light'
      let savedSidebar = null

      try {
        savedTheme = localStorage.getItem('theme') || 'light'
        savedSidebar = localStorage.getItem('sidebarOpen')
      } catch (_error) {
        // Storageが利用できない環境ではdefault stateで表示する。
      }

      const isSidebarOpen = savedSidebar === null || savedSidebar === 'true'
      document.documentElement.setAttribute('data-theme', savedTheme)
      document.documentElement.setAttribute('data-sidebar-open', String(isSidebarOpen))

      document.addEventListener('DOMContentLoaded', () => {
        document.body.setAttribute('data-theme', savedTheme)
      })
    })()
  </script>

  <title>Sokora - {% if title_text %}{{ title_text }}{% else %}勤怠管理システム{% endif %}</title>
