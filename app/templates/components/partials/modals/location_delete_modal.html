{% import "components/macros/modal.html" as modal_ui %}

{% call modal_ui.delete_modal_form(
  id = modal_id,
  title = "勤怠種別の削除",
  action = "/locations/" ~ location.id,
  item_name = location.name,
  submit_text = "削除"
) %}
  {% if warning_message %}
    <div class="text-warning text-sm mt-2">{{ warning_message }}</div>
  {% endif %}
{% endcall %}
